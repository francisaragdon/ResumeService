trigger:
  branches:
    include:
      - QA
      - master

variables:
  imageName: ghcr.io/francisaragdon/resumeservice/app

stages:

  # =========================
  # BUILD + PUSH IMAGE
  # =========================
  - stage: Build
    displayName: Build and Push Docker Image
    jobs:
      - job: BuildPush
        pool:
          vmImage: ubuntu-latest
        steps:

          - checkout: self

          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: 'GHCR-ServiceConnection'

          - task: Docker@2
            displayName: Build and Push QA Image
            inputs:
              command: buildAndPush
              containerRegistry: 'GHCR-ServiceConnection'
              repository: francisaragdon/resumeservice/app
              Dockerfile: '**/Dockerfile'
              tags: |
                qa

          - task: Docker@2
            displayName: Build and Push Staging Image
            inputs:
              command: buildAndPush
              containerRegistry: 'GHCR-ServiceConnection'
              repository: francisaragdon/resumeservice/app
              Dockerfile: '**/Dockerfile'
              tags: |
                staging

          - task: Docker@2
            displayName: Build and Push Prod Image
            inputs:
              command: buildAndPush
              containerRegistry: 'GHCR-ServiceConnection'
              repository: francisaragdon/resumeservice/app
              Dockerfile: '**/Dockerfile'
              tags: |
                prod
  

  # =========================
  # DEPLOY QA + TEST
  # =========================
  - stage: Deploy_QA
    dependsOn: Build
    jobs:
      - deployment: DeployQA
        environment: QA
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureCLI@2
                  displayName: Deploy to QA Container App
                  inputs:
                    azureSubscription: 'Azure-ServiceConnection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name app-qa-v2 \
                        --resource-group Automation-RG \
                        --image ghcr.io/francisaragdon/resumeservice/app:qa

                - checkout: self

                - task: Maven@4
                  displayName: Run QA Tests
                  inputs:
                    mavenPomFile: 'pom.xml'
                    goals: 'clean verify -Denv=QA'


  # =========================
  # DEPLOY STAGING + TEST
  # =========================
  - stage: Deploy_Staging
    dependsOn: Deploy_QA
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        environment: Staging
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureCLI@2
                  displayName: Deploy to Staging Container App
                  inputs:
                    azureSubscription: 'Azure-ServiceConnection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name app-staging-v2 \
                        --resource-group Automation-RG \
                        --image ghcr.io/francisaragdon/resumeservice/app:staging

                - checkout: self

                - task: Maven@4
                  displayName: Run Staging Tests
                  inputs:
                    mavenPomFile: 'pom.xml'
                    goals: 'clean verify -Denv=Staging'


  # =========================
  # DEPLOY PROD (OPTIONAL APPROVAL)
  # =========================
  - stage: Deploy_Prod
    dependsOn: Deploy_Staging
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        environment: Prod   # You can configure approvals in Azure DevOps UI
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureCLI@2
                  displayName: Deploy to Prod Container App
                  inputs:
                    azureSubscription: 'Azure-ServiceConnection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name app-prod-v2 \
                        --resource-group Automation-RG \
                        --image ghcr.io/francisaragdon/resumeservice/app:prod